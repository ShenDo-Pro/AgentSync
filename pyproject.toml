[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsync"
version = "0.2.0"
description = "Local-first cross-IDE message sharing and incremental cloud sync"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AgentSync contributors"}]

[project.scripts]
agentsync = "agentsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
