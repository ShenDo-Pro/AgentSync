name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --clean --onefile --name AgentSync.Client scripts/client.py
      - run: pyinstaller --clean --onefile --name AgentSync.Server scripts/server.py
      - shell: pwsh
        run: |
          & .\dist\AgentSync.Client.exe --help
          & .\dist\AgentSync.Server.exe --help
      - shell: pwsh
        run: |
          Copy-Item scripts/install-windows-client.ps1 dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath AgentSync-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSync-Windows
          path: AgentSync-Windows.zip

  docker-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentsync-cloud:ci .
